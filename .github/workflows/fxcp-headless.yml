name: Build fxcp headless host
on:
  workflow_dispatch:
  push:
    paths:
      - 'ports/windows/**'
      - 'py/**'
      - '.github/workflows/fxcp-headless.yml'
  pull_request:
    paths:
      - 'ports/windows/**'
      - 'py/**'
      - '.github/workflows/fxcp-headless.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            make
            python
            mingw-w64-i686-gcc
      - name: Build 32-bit tracing interpreter
        working-directory: ports/windows
        run: make -j2 VARIANT=fxcp_headless
      - name: Smoke test native tracing module
        run: >-
          ports/windows/build-fxcp_headless/micropython.exe -c
          "import gint, struct; assert struct.calcsize('P') == 4; gint.trace_reset(); gint.drect(0, 0, 9, 13, 0); img = gint.image(5, 16, 10, 14, 5, bytearray(70), bytearray(32)); gint.dsubimage(0, 0, img, 0, 0, 10, 14); gint.dupdate(); assert gint.trace_stats() == (1, 2, 0, 280); gint.trace_touch(1, 160, 400); ev = gint.pollevent(); assert (ev.type, ev.x, ev.y) == (1, 160, 400)"
      - name: Smoke test new headless drawing and memoryview API
        run: >-
          ports/windows/build-fxcp_headless/micropython.exe -c
          "import gint; assert bytes(memoryview(b'abcdef')[1:4]) == b'bcd'; gint.trace_reset(); gint.dpixel(5, 6, 0); gint.dpixel(-1, 6, 0); gint.dtext(0, 0, 0, 'ABC'); gint.dline(0, 0, 2, 0, 0); assert gint.C_RGB(31, 63, 31) == 65535; assert gint.trace_stats() == (0, 4, 0, 184)"

      - name: Checkout MiscPythonExtra portable LZW
        uses: actions/checkout@v4
        with:
          repository: TheRainbowPhoenix/MiscPythonExtra
          ref: compat/micropython-lzw-bytes
          path: misc-examples
          persist-credentials: false
      - name: Test unmodified LZW round trip on Windows
        run: >-
          ports/windows/build-fxcp_headless/micropython.exe -c
          "import sys; sys.path.insert(0,'misc-examples'); import lzw; b=b'TOBEORNOTTOBEORTOBEORNOT'; assert lzw.decompress(lzw.compress(b)) == b"

      - uses: actions/upload-artifact@v4
        with:
          name: PythonExtra-fxcp-headless-win32
          path: ports/windows/build-fxcp_headless/micropython.exe
          if-no-files-found: error

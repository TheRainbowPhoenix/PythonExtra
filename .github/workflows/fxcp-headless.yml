name: Build fxcp headless host
on:
  workflow_dispatch:
  push:
    paths:
      - 'ports/windows/**'
      - 'py/**'
      - '.github/workflows/fxcp-headless.yml'
  pull_request:
    paths:
      - 'ports/windows/**'
      - 'py/**'
      - '.github/workflows/fxcp-headless.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            make
            python
            mingw-w64-i686-gcc
      - name: Build 32-bit tracing interpreter
        working-directory: ports/windows
        run: make -j2 VARIANT=fxcp_headless
      - name: Checkout published gint type contract
        uses: actions/checkout@v4
        with:
          repository: TheRainbowPhoenix/pythonextra-template
          ref: master
          path: typing-reference
          persist-credentials: false

      - name: Check Windows gint runtime typing coverage
        run: >-
          python tools/pe-headless/type_coverage.py
          --exe ports/windows/build-fxcp_headless/micropython.exe
          --typing typing-reference/.typings/gint.pyi

      - name: Check small headless typing semantics
        run: >-
          python tools/pe-headless/test_gint_contract.py
          --exe ports/windows/build-fxcp_headless/micropython.exe

      - name: Test opt-in timed Graphics recording
        run: python tools/pe-headless/test_draw_record.py --exe ports/windows/build-fxcp_headless/micropython.exe

      - name: Smoke test native tracing module
        run: >-
          ports/windows/build-fxcp_headless/micropython.exe -c
          "import gint, struct; assert struct.calcsize('P') == 4; gint.trace_reset(); gint.drect(0, 0, 9, 13, 0); img = gint.image(gint.IMAGE_P4_RGB565, 16, 10, 14, 5, bytearray(70), bytearray(32)); gint.dsubimage(0, 0, img, 0, 0, 10, 14); gint.dupdate(); assert gint.trace_stats() == (1, 2, 0, 280); gint.trace_touch(1, 160, 400); ev = gint.pollevent(); assert (ev.type, ev.x, ev.y) == (1, 160, 400)"
      - name: Smoke test new headless drawing and memoryview API
        run: >-
          ports/windows/build-fxcp_headless/micropython.exe -c
          "import gint; assert bytes(memoryview(b'abcdef')[1:4]) == b'bcd'; gint.trace_reset(); gint.dpixel(5, 6, 0); gint.dpixel(-1, 6, 0); gint.dtext(0, 0, 0, 'ABC'); gint.dline(0, 0, 2, 0, 0); assert gint.C_RGB(31, 5, 5) == ((31<<11)|(5<<6)|5); assert gint.trace_stats() == (0, 4, 0, 184)"

      - name: Smoke test key transitions and clipped graphics window
        run: >-
          ports/windows/build-fxcp_headless/micropython.exe -c
          "import gint; gint.trace_reset(); assert gint.dwindow_get() == (0,0,320,528); gint.trace_keys(gint.KEY_LEFT); assert gint.keypressed(gint.KEY_LEFT); gint.cleareventflips(); assert not gint.keypressed(gint.KEY_LEFT); gint.trace_keys(0); assert gint.keyreleased(gint.KEY_LEFT); old=gint.dwindow_set(0,0,4,4); gint.dpixel(8,8,0); gint.dpixel(2,2,0); assert gint.trace_stats()[-1] == 1; assert gint.dwindow_set(*old) == (0,0,4,4)"

      - name: Checkout MiscPythonExtra portable LZW
        uses: actions/checkout@v4
        with:
          repository: TheRainbowPhoenix/MiscPythonExtra
          ref: feature/pe-headless-devtools
          path: misc-examples
          persist-credentials: false
      - name: Test unmodified LZW round trip on Windows
        run: >-
          ports/windows/build-fxcp_headless/micropython.exe -c
          "import sys; sys.path.insert(0,'misc-examples'); import lzw; b=b'TOBEORNOTTOBEORTOBEORNOT'; assert lzw.decompress(lzw.compress(b)) == b"

      - name: Build full SHM instrumentation host
        working-directory: ports/windows
        run: make -j2 VARIANT=fxcp_instrument

      - name: Check full SHM instrumentation gint typing coverage
        run: >-
          python tools/pe-headless/type_coverage.py
          --exe ports/windows/build-fxcp_instrument/micropython.exe
          --typing typing-reference/.typings/gint.pyi

      - name: Check full instrumentation typing semantics
        run: >-
          python tools/pe-headless/test_gint_contract.py
          --exe ports/windows/build-fxcp_instrument/micropython.exe

      - name: Test full SHM Graphics recorder and independent screen reader
        run: >-
          python tools/pe-headless/test_instrument_graphics.py
          --exe ports/windows/build-fxcp_instrument/micropython.exe

      - name: Test virtual USB bridge SHM protocol
        run: python tools/pe-headless/test_usb_bridge.py

      - name: Test actual gint.USB over SHM / TCP loopback
        run: >-
          python tools/pe-headless/test_instrument_usb.py
          --exe ports/windows/build-fxcp_instrument/micropython.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PythonExtra-fxcp-instrument-win32
          path: ports/windows/build-fxcp_instrument/micropython.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PythonExtra-fxcp-headless-win32
          path: ports/windows/build-fxcp_headless/micropython.exe
          if-no-files-found: error
